<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="NailsByMandisa — clean, chic, creative nail art. Book manicures, pedicures, gel, acrylic, polygel and nail art online."
    />
    <link rel="canonical" href="https://nailsbymandisa.com/" />
    <link rel="icon" type="image/png" href="/icons/icon-32.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>NailsByMandisa — Nail Salon in Strubensvalley, Roodepoort</title>
    <!-- Open Graph / Twitter Card defaults — this is the raw HTML link-preview bots
         (WhatsApp, Facebook, Twitter/X) and non-JS crawlers actually see, since they never
         run the client-side useDocumentMeta hook that overrides these per route. Real
         browsers/Googlebot get the per-page version from that hook once JS runs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NailsByMandisa" />
    <meta property="og:title" content="NailsByMandisa — Nail Salon in Strubensvalley, Roodepoort" />
    <meta
      property="og:description"
      content="Clean, chic, creative nail art. Book manicures, pedicures, gel, acrylic, polygel and nail art online."
    />
    <meta property="og:url" content="https://nailsbymandisa.com/" />
    <meta property="og:image" content="https://nailsbymandisa.com/brand/logo-lockup.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NailsByMandisa — Nail Salon in Strubensvalley, Roodepoort" />
    <meta
      name="twitter:description"
      content="Clean, chic, creative nail art. Book manicures, pedicures, gel, acrylic, polygel and nail art online."
    />
    <meta name="twitter:image" content="https://nailsbymandisa.com/brand/logo-lockup.png" />
    <!-- LocalBusiness structured data — mirrors the SETTINGS defaults in
         api/src/models/settings.js; keep the two in sync since this is static markup,
         not rendered from live settings, in a client-rendered SPA without SSR. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "NailSalon",
        "name": "NailsByMandisa",
        "image": "https://nailsbymandisa.com/icons/icon-512.png",
        "telephone": "+27766878843",
        "email": "nailsbymandisa@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "882 Almondrock",
          "addressLocality": "Strubensvalley, Roodepoort",
          "postalCode": "1734",
          "addressCountry": "ZA"
        },
        "openingHoursSpecification": [
          { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday"], "opens": "09:00", "closes": "17:00" }
        ],
        "priceRange": "R"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
